limitations:
  - Current survivors omit failed, delisted and acquired firms; delisting completeness is false.
  - Current business groups are backfilled research assumptions; historical industry membership is not known.
  - US domestic reporting refers to 10-K/10-Q reporting, not US incorporation.
  - SEC ticker-directory membership alone does not verify reporting regime or common-stock continuity.
  - Yahoo is retrospectively adjusted history, not adjustment vintages; ticker histories need identity review.
  - Price first/last observations are source coverage dates, never inferred listing or delisting dates.
