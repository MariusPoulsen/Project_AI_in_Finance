[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#58A6FF"
backgroundColor = "#171719"
secondaryBackgroundColor = "#1D1E22"
textColor = "#F2F3F5"
redColor = "#F08A92"
yellowColor = "#D7B878"
greenColor = "#83C4AD"
blueColor = "#58A6FF"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM Plex Sans Condensed:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap, monospace"
baseRadius = "small"
borderColor = "#373B43"
showWidgetBorder = true
chartCategoricalColors = ["#58A6FF", "#DCE0E7", "#ABB1BD", "#D7B878", "#83C4AD"]

[theme.sidebar]
backgroundColor = "#141416"
