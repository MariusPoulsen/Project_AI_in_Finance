[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "structural-break-detector"
version = "0.1.0"
description = "Point-in-time statistical-arbitrage research infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "editables>=0.5,<1",
  "duckdb>=1.4,<2", "numpy>=2,<3", "pandas>=2.2,<3",
  "pyarrow>=19,<24", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7", "pandera[pandas]>=0.24,<1",
  "yfinance>=0.2.65,<1", "exchange-calendars>=4.11,<5",
  "statsmodels>=0.14,<1", "matplotlib>=3.10,<4",
  "scikit-learn>=1.7,<2", "xgboost>=3,<4", "shap>=0.48,<1", "mlflow>=3,<4",
  "threadpoolctl>=3.6,<4",
  "streamlit>=1.45,<2", "plotly>=6,<7",
]

[project.optional-dependencies]
research = ["scikit-learn>=1.7,<2", "xgboost>=3,<4", "shap>=0.48,<1", "mlflow>=3,<4"]
agents = ["litellm>=1.70,<2", "langgraph>=1,<2"]
nlp = ["torch>=2.6,<3", "transformers>=4.48,<5"]
app = ["streamlit>=1.45,<2", "plotly>=6,<7"]

[project.scripts]
structural-break = "structural_break.cli:main"
structural-break-research = "structural_break.research.cli:main"
structural-break-reference = "structural_break.services.foundation:main"
structural-break-agents = "structural_break.agents.cli:main"
structural-break-team = "structural_break.collaboration.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "pytest-xdist>=3.6,<4", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pandas-stubs>=2.2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/structural_break"]
dev-mode-exact = true

[tool.uv]
constraint-dependencies = ["numba>=0.62,<0.65"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "yfinance", "exchange_calendars", "exchange_calendars.*", "statsmodels", "statsmodels.*", "matplotlib", "matplotlib.*", "sklearn", "sklearn.*", "xgboost", "xgboost.*", "shap", "shap.*", "mlflow", "mlflow.*", "scipy", "scipy.*", "streamlit", "streamlit.*", "plotly", "plotly.*", "joblib", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --disable-socket"

