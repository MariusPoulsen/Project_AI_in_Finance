name: Foundation and data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - run: uv run --frozen structural-break init-db
      - run: uv run --frozen structural-break storage-smoke
      - run: uv run --frozen structural-break storage-smoke
      - name: Ingest complete synthetic data snapshot
        run: >-
          uv run --frozen structural-break ingest-data
          --fixture tests/fixtures/phase1
          --workspace-root .acceptance/phase1-ci
          --snapshot-id phase1-ci-fixture
      - name: Rebuild curated data from immutable raw sources offline
        run: >-
          uv run --frozen structural-break replay-data
          --replay-from phase1-ci-fixture
          --snapshot-id phase1-ci-replay
          --workspace-root .acceptance/phase1-ci
      - name: Verify active data snapshot
        run: >-
          uv run --frozen structural-break verify-data
          --workspace-root .acceptance/phase1-ci

  colab-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - run: >-
          python scripts/colab_bootstrap.py
          --workspace-root /tmp/colab-foundation
          --data-fixture
      - run: uv run --frozen pytest
